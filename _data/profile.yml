short_bio: >-
  <p>
    I am currently a fourth year undergraduate student from
    <a href="https://automation.xjtu.edu.cn/" target="_blank">the School of Automation</a>,
    <a href="https://xjtu.edu.cn" target="_blank">Xi'an Jiaotong University</a>.
    My research interests include pattern recognition, artificial intelligence, and bioinformatics.
  </p>

  <h2>Related Undergraduate Resources</h2>
  <p>
    As an undergraduate student from XJTU, I got relatively good exam marks in various courses.
    As a student about to graduate, I want to share some of the resources online to help more
    students master these courses more proficiently. Therefore, I created a new repository on
    GitHub and share my notes and some of the other materials such as project code. All of the
    resources are open source and free. The only thing worth noting is that these materials are
    only suitable for students majoring in automation science or majors related to that.
  </p>

  <h2>Undergraduate Research Projects</h2>
  <p>
    I have been a member of <a href="https://www.ai4bread.com/" target="_blank">AI4Bread</a> since
    Aug. 2024. My undergraduate tutor is Associate Professor
    <a href="https://gr.xjtu.edu.cn/laiyifu/zh_CN/index.htm" target="_blank">Laiyi Fu</a> in the
    School of Automation, XJTU. I joined the stCAMBL project and became its primary student
    researcher. A paper was accepted by
    <a href="https://academic.oup.com/bib/article/27/3/bbag215/8675954" target="_blank">Briefings in Bioinformatics</a>
    in May 2026. For more information, please visit the
    <a href="https://github.com/AI4Bread/stCAMBL" target="_blank">project repository</a>.
  </p>

